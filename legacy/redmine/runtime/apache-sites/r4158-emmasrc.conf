# 由 console 產生（工單 #4158 / emmasrc），請勿手改；用 `console site rm` 移除。
<VirtualHost *:443>
    ServerName local-r4158.femascloud.com
    DocumentRoot "/var/www/tickets/4158/emmasrc"
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile "/etc/apache2/ssl/self-signed-wildcard_femascloud.com/fullchain.pem"
    SSLCertificateKeyFile "/etc/apache2/ssl/self-signed-wildcard_femascloud.com/privkey.pem"

    <Directory "/var/www/tickets/4158/emmasrc">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /robots.txt "/var/www/tickets/4158/emmasrc/emma/webroot/robots.txt"
    Alias /img "/var/www/tickets/4158/emmasrc/emma/webroot/img/"
    Alias /emma/img "/var/www/tickets/4158/emmasrc/emma/webroot/img/"
    AliasMatch "^\/[a-z0-9_-]{1,}(.*)$" "/var/www/tickets/4158/emmasrc/emma/webroot$1"

    ProxyPreserveHost On

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://php73:9000"
    </FilesMatch>
    # 設定 Authorization header 給 php-fpm 使用
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{REQUEST_FILENAME}"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
