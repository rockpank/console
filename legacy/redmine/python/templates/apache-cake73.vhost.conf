# 由 console 產生（工單 #{{ticket}} / {{project}}），請勿手改；用 `console site rm` 移除。
<VirtualHost *:443>
    ServerName {{host}}
    DocumentRoot "{{docroot}}"
    DirectoryIndex index.php

    SSLEngine on
    SSLCertificateFile "{{ssl_cert}}"
    SSLCertificateKeyFile "{{ssl_key}}"

    <Directory "{{docroot}}">
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Alias /robots.txt "{{docroot}}/emma/webroot/robots.txt"
    Alias /img "{{docroot}}/emma/webroot/img/"
    Alias /emma/img "{{docroot}}/emma/webroot/img/"
    AliasMatch "^\/[a-z0-9_-]{1,}(.*)$" "{{docroot}}/emma/webroot$1"

    ProxyPreserveHost On

    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://{{php_fpm}}"
    </FilesMatch>
    # 設定 Authorization header 給 php-fpm 使用
    SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
    ProxyFCGISetEnvIf "true" SCRIPT_FILENAME "%{REQUEST_FILENAME}"

    ErrorLog  /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
